<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="digits" width="420" height="24" patternUnits="userSpaceOnUse">
      <text x="0" y="16" font-family="ui-monospace,monospace" font-size="13"
            fill="#38bdf8" fill-opacity="0.07">3141592653589793238462643383279</text>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#digits)"/>
  <circle cx="120" cy="70" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="1080" cy="250" r="4" fill="#f472b6" opacity="0.4"/>
  <text x="600" y="150" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="68" font-weight="700" fill="url(#fg)">π PATTERN SEARCHER</text>
  <text x="600" y="198" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="19"
        fill="#94a3b8">3.14159265358979323846264338327950288…</text>
  <text x="600" y="242" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="17"
        fill="#64748b">find any number — or any word — inside π</text>
</svg>
